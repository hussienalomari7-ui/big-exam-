<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Data (Part 1) — 70-Question Deep Conceptual Exam Lab</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #263449;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --green-bg: rgba(16, 185, 129, 0.16);
      --green-border: #10b981;
      --green-text: #6ee7b7;
      --red-bg: rgba(239, 68, 68, 0.16);
      --red-border: #ef4444;
      --red-text: #fca5a5;
      --badge-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title-area h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .title-area p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .stat-pill.correct {
      border-color: var(--green-border);
      color: var(--green-text);
    }

    .stat-pill.wrong {
      border-color: var(--red-border);
      color: var(--red-text);
    }

    .btn {
      background: var(--accent-dark);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px;
    }

    .chip {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .chip.active, .chip:hover {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .q-card.answered-correct {
      border-left: 5px solid var(--green-border);
    }

    .q-card.answered-wrong {
      border-left: 5px solid var(--red-border);
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .badge.slide {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.35);
    }

    .badge.type {
      color: #c084fc;
      border-color: rgba(192, 132, 252, 0.35);
    }

    .q-text {
      font-size: 1.04rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #f1f5f9;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 0.94rem;
      line-height: 1.5;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      min-width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .opt-btn.correct-choice {
      background: var(--green-bg) !important;
      border-color: var(--green-border) !important;
      color: #ecfdf5 !important;
    }

    .opt-btn.correct-choice .opt-letter {
      background: var(--green-border);
      border-color: var(--green-border);
      color: #064e3b;
    }

    .opt-btn.wrong-choice {
      background: var(--red-bg) !important;
      border-color: var(--red-border) !important;
      color: #fef2f2 !important;
    }

    .opt-btn.wrong-choice .opt-letter {
      background: var(--red-border);
      border-color: var(--red-border);
      color: #fff;
    }

    .explanation-box {
      margin-top: 16px;
      padding: 15px 18px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      color: #cbd5e1;
      display: none;
    }

    .explanation-box.visible {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.86rem;
    }

    .exp-header.pass {
      color: var(--green-text);
    }

    .exp-header.fail {
      color: var(--red-text);
    }

    .retry-mini {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .retry-mini:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="title-area">
        <h1>Big Data (Part 1) — Deep Conceptual Exam Lab</h1>
        <p>70 Analytical & Scenario-Based Questions • Covers All 45 Slides • Instant Feedback</p>
      </div>
      <div class="stats-bar">
        <span class="stat-pill" id="stat-progress">Answered: 0 / 70</span>
        <span class="stat-pill correct" id="stat-correct">Correct: 0</span>
        <span class="stat-pill wrong" id="stat-wrong">Wrong: 0</span>
        <span class="stat-pill" id="stat-score">Score: 0%</span>
        <button class="btn btn-outline" onclick="resetAll()">Reset Lab</button>
        <button class="btn" onclick="downloadHTML()">Download HTML</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="controls">
      <input type="text" id="searchBox" class="search-input" placeholder="Search questions, concepts, case studies (e.g., Veracity, Hurricane Michael, NameNode, Shuffle, local[4])..." oninput="renderQuestions()" />
      <div class="filter-row" id="topicFilters">
        <span class="filter-label">Topic:</span>
        <button class="chip active" onclick="setTopic('ALL', this)">All 70 Questions</button>
        <button class="chip" onclick="setTopic('Core & Data Types', this)">Core & Data Types (Slides 1–7)</button>
        <button class="chip" onclick="setTopic('The 5 Vs', this)">The 5 V's (Slides 8–9)</button>
        <button class="chip" onclick="setTopic('Case 1: Google Maps', this)">Google Maps (Slides 10–16)</button>
        <button class="chip" onclick="setTopic('Case 2: Hurricane Michael', this)">Hurricane Michael (Slides 17–21)</button>
        <button class="chip" onclick="setTopic('Lifecycle, Challenges & Systems', this)">Lifecycle & Systems (Slides 22–26)</button>
        <button class="chip" onclick="setTopic('Distributed & Racks/Clusters', this)">Distributed & Racks (Slides 27–35)</button>
        <button class="chip" onclick="setTopic('HDFS, MapReduce, YARN & Spark', this)">HDFS, MapReduce & Spark (Slides 36–45)</button>
      </div>
      <div class="filter-row" id="statusFilters">
        <span class="filter-label">Filter:</span>
        <button class="chip active" onclick="setStatus('ALL', this)">All Statuses</button>
        <button class="chip" onclick="setStatus('UNANSWERED', this)">Unanswered</button>
        <button class="chip" onclick="setStatus('WRONG', this)">Incorrect Only</button>
        <button class="chip" onclick="setStatus('FALSE_STMT', this)">"Identify the FALSE Statement" Questions</button>
      </div>
    </div>

    <div id="questionsContainer"></div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        topic: "Core & Data Types",
        slide: "Slides 2 & 3",
        type: "Scenario Analysis",
        q: "A retail corporation installs thousands of in-store sensors and records every online click, doubling its stored data every month. However, executives complain that strategic decisions have not improved. Based on the course background, what is the root cause of this problem?",
        options: [
          "Everyday devices and online transactions generate unstructured data that cannot be stored digitally.",
          "More data does not equal more value unless the organization can effectively analyze it to turn data into useful information.",
          "Big Data systems only generate value when historical data is deleted and replaced with real-time sensor streams.",
          "Traditional single-server databases automatically extract insights, so adding sensors reduces data veracity."
        ],
        ans: 1,
        exp: "Slides 2 & 3 emphasize that the course goal is understanding 'how data becomes useful information' and explicitly state: 'More data ≠ more value unless we can analyze it.'"
      },
      {
        id: 2,
        topic: "Core & Data Types",
        slide: "Slide 4",
        type: "Identify the FALSE Statement",
        q: "Which of the following statements is FALSE regarding the definition and nature of Big Data?",
        options: [
          "Big Data refers to data whose scale, speed, or complexity makes traditional processing approaches difficult or inefficient.",
          "The primary objective of handling Big Data is to obtain valuable insights and support better decision-making.",
          "Big Data is a specific commercial software product that organizations purchase to replace all relational databases.",
          "A dataset can qualify as a Big Data challenge due to its velocity, variety, or data quality issues, not solely its storage volume."
        ],
        ans: 2,
        exp: "Slide 4 explicitly states: 'Big Data is not one software product.' It is defined by scale, speed, or complexity (volume, velocity, variety, or data quality) that challenges traditional processing."
      },
      {
        id: 3,
        topic: "Core & Data Types",
        slide: "Slide 4",
        type: "Conceptual Analysis",
        q: "A hospital collects continuous patient monitoring streams, doctor free-text notes, and diagnostic images. Even though the total storage size this week is only a few hundred gigabytes, their legacy database fails to process it efficiently. Why does this scenario still represent a Big Data problem?",
        options: [
          "Because traditional processing approaches can be overwhelmed by rapid arrival speed (velocity), format complexity (variety), or data quality challenges, not just massive volume.",
          "Because healthcare data is classified as semi-structured SQL tables that require a central server bottleneck.",
          "Because any data generated by medical monitoring devices is automatically replicated across thousands of server racks.",
          "Because legacy databases can only process unstructured audio and image files, failing when structured rows are introduced."
        ],
        ans: 0,
        exp: "Slide 4 notes that Big Data refers to data whose 'scale, speed, or complexity makes traditional processing approaches difficult or inefficient' and that 'The challenge can be volume, velocity, variety, or data quality.'"
      },
      {
        id: 4,
        topic: "Core & Data Types",
        slide: "Slide 3",
        type: "Architectural Reasoning",
        q: "As everyday devices, phones, sensors, social media, and online transactions generate data continuously, which three interconnected technical stages become progressively more challenging as the data grows?",
        options: [
          "Purchasing single software licenses, upgrading one central CPU, and manually reading every record.",
          "Converting all JSON files into audio streams, deleting historical logs, and disabling network connections.",
          "Eliminating distributed workers, centralizing all requests into one table, and bypassing quality checks.",
          "Storing, processing, and analyzing the growing data effectively."
        ],
        ans: 3,
        exp: "Slide 3 states: 'As data grows, storing, processing, and analyzing it becomes more challenging.'"
      },
      {
        id: 5,
        topic: "Core & Data Types",
        slide: "Slide 4 & 7",
        type: "Conceptual Evaluation",
        q: "How do the slides frame the relationship between raw data collection and organizational decision-making?",
        options: [
          "Collecting larger volumes of raw data automatically guarantees superior operational and strategic decisions.",
          "Obtaining valuable insights and supporting decisions is the objective, and collecting more data alone does not guarantee better decisions.",
          "Decisions should rely exclusively on real-time streaming data while discarding historical datasets.",
          "Mathematical and predictive models are unnecessary once a dataset reaches sufficient scale and velocity."
        ],
        ans: 1,
        exp: "Slide 4 states 'The objective is to obtain valuable insights and support decisions,' and Slide 7 warns: 'Collecting more data alone does not guarantee better decisions.'"
      },
      {
        id: 6,
        topic: "Core & Data Types",
        slide: "Slide 5",
        type: "Scenario Analysis",
        q: "A smart city initiative integrates vehicle speeds and routes from commuters, power usage and temperature from street grids, and clinical monitoring logs from ambulances. According to the 'What Comes Under Big Data?' classification, which three domains are being combined?",
        options: [
          "Social Media, Online Shopping, and Finance",
          "Online Shopping, Finance, and Traditional Relational Warehouses",
          "Social Media, Finance, and Server Rack Cabinet Management",
          "Transport & GPS, IoT & Sensors, and Healthcare"
        ],
        ans: 3,
        exp: "Slide 5 categorizes 'Locations, routes, vehicle speeds' under Transport & GPS; 'Temperature, traffic, power usage' under IoT & Sensors; and 'Medical records, monitoring devices' under Healthcare."
      },
      {
        id: 7,
        topic: "Core & Data Types",
        slide: "Slide 5",
        type: "Identify the FALSE Statement",
        q: "Which of the following statements about Big Data sources and the data they produce is INCORRECT according to Slide 5?",
        options: [
          "Online Shopping platforms primarily generate data through customer orders, searches, and clicks.",
          "Finance systems generate transactions and market data, while Social Media generates posts, messages, and videos.",
          "All six Big Data source categories produce identical amounts, arrival speeds, and tabular formats of data.",
          "Different sources produce different amounts, speeds, and formats of data across domains."
        ],
        ans: 2,
        exp: "Slide 5 explicitly concludes: 'Different sources produce different amounts, speeds, and formats of data.'"
      },
      {
        id: 8,
        topic: "Core & Data Types",
        slide: "Slide 6",
        type: "Deep Comparison",
        q: "An e-commerce company stores customer orders in SQL tables and CSV files, product catalog attributes in nested JSON and XML documents, and customer support phone recordings along with product photos. How are these three data groups classified?",
        options: [
          "SQL/CSV are Structured; JSON/XML are Semi-Structured; audio recordings and images are Unstructured.",

          "SQL/CSV and JSON/XML are both Structured; only audio recordings and images are Semi-Structured.",
          "CSV and JSON are Unstructured text; SQL tables are Structured; images and XML are Semi-Structured."
        ],
        ans: 0,
        exp: "Slide 6 defines: Structured (defined rows and columns: SQL tables, CSV files), Semi-Structured (fields and nested records, no single fixed table: JSON, XML), and Unstructured (no fixed tabular representation: Images, audio, free text)."
      },
      {
        id: 9,
        topic: "Core & Data Types",
        slide: "Slide 6",
        type: "Conceptual Analysis",
        q: "Why are JSON and XML files classified as 'Semi-Structured' rather than 'Structured' or 'Unstructured'?",
        options: [
          "Because they consist of raw pixel and audio waveforms without any recognizable field names or delimiters.",
          "Because they enforce a single fixed relational table with strict rows and columns identical to SQL tables.",
          "Because they organize data using fields and nested records, but do not conform to a single fixed table.",
          "Because they can only be stored on a single central server and cannot be read by Apache Spark."
        ],
        ans: 2,
        exp: "Slide 6 defines Semi-Structured data (JSON, XML) as having 'Fields and nested records. No single fixed table.'"
      },
      {
        id: 10,
        topic: "Core & Data Types",
        slide: "Slide 6",
        type: "Scenario Analysis",
        q: "A medical researcher analyzes doctor clinical notes written in free text alongside retinal scan images, and links them to a patient summary exported as a CSV file. Which statement accurately describes the structure of these inputs?",
        options: [
          "Both the clinical free text and the CSV file are Unstructured because they contain text characters.",
          "The free text and images are Unstructured (lacking a fixed tabular representation), whereas the CSV file is Structured (organized in defined rows and columns).",
          "The free text is Semi-Structured like XML, while the CSV file and retinal images are Structured.",
          "All three inputs are Semi-Structured because medical records contain nested fields."
        ],
        ans: 1,
        exp: "Slide 6 explicitly lists 'Images, audio, free text' as Unstructured ('Content without a fixed tabular representation') and 'SQL tables, CSV files' as Structured ('Organized in defined rows and columns')."
      },
      {
        id: 11,
        topic: "Core & Data Types",
        slide: "Slide 7",

        exp: "Slide 7 carefully qualifies prediction: 'Predict future events and trends when appropriate models are used,' and reiterates that 'Collecting more data alone does not guarantee better decisions.'"
      },
      {

        topic: "Core & Data Types",
        slide: "Slide 7",

          "Use both current and historical data together with appropriate models to improve decisions, predict trends, and allocate resources.",
          "Rely solely on today's live GPS streams because historical data reduces processing velocity.",
          "Inspect the millions of GPS logs manually without analytical models to avoid coordination costs.",
          "Wait until all unstructured incident reports are converted into audio files before planning routes."
        ],
        ans: 0,
        exp: "Slide 7 highlights using 'current and historical data' to improve decisions, finding patterns difficult to see manually, predicting future events when appropriate models are used, and supporting planning and resource allocation."
      },
      {

        topic: "The 5 Vs",
        slide: "Slides 8 & 9",
        type: "Scenario Analysis",

          "Aspect X is Value; Aspect Y is Variety."
        ],
        ans: 2,
        exp: "Slides 8 & 9 define Volume as 'How much data? Huge datasets / Millions of traffic observations' and Velocity as 'How fast? / How quickly does it arrive? Continuous streams / Location updates over time.'"
      },
      {
        id: 14,
        topic: "The 5 Vs",

          "Variety answers 'What can we do with the data?'; Veracity answers 'How many observations were collected?'"

        ans: 1,
        exp: "Slides 8 & 9 define Variety as 'What types? / What form does it take? (Text, images, GPS, maps, incident reports)' and Veracity as 'Can we trust it? / Is the information reliable? (Errors, missing data / GPS can be inaccurate).'"
      },
      {
        id: 15,
        topic: "The 5 Vs",
        slide: "Slides 8 & 9",
        type: "Identify the FALSE Statement",
        q: "Which of the following statements about the 5 V's of Big Data is FALSE?",
        options: [
          "Big Data is defined exclusively by dataset size (Volume); if a dataset is not massive in size, the other V's do not apply.",
          "Velocity addresses how quickly data arrives, such as continuous streams of location updates over time.",
          "Veracity addresses data reliability and trust, accounting for sensor errors, inaccuracies, and missing data.",
          "Value addresses why the data is useful and what we can do with it, such as producing better route and ETA estimates."
        ],
        ans: 0,
        exp: "Slide 8 explicitly highlights at the bottom: 'Big Data is not only about size (Volume).'"
      },
      {

        q: "An IoT traffic system ingests huge datasets (Volume) of continuous streams (Velocity) combining GPS coordinates, road maps, and text incident reports (Variety). However, 40% of the GPS sensors have severe signal drift and missing timestamps that go uncorrected. How does this impact the 5 V's?",

        ans: 3,
        wait_check: "Wait—let's make sure index 3 is the correct option for Q16 as planned in our key! Let's place the correct option at index 3 (D)!",
        options: [
          "High Volume and Velocity automatically compensate for low Veracity, guaranteeing accurate route recommendations.",
          "Missing timestamps eliminate Velocity and convert Semi-Structured JSON into Structured SQL tables.",
          "Signal drift increases Value because any corrupted GPS reading proves that the highway is congested.",
          "Poor Veracity compromises the reliability of the data, which directly undermines the ability to extract trustworthy Value (better decisions and accurate ETA estimates)."

        ans: 3,
        exp: "Slides 8 & 9 show that Veracity ('Can we trust it? Errors, missing data / GPS can be inaccurate') is essential to achieving Value ('Why useful? Better decisions / Better route and ETA estimates')."
      },
      {
        id: 17,
        topic: "The 5 Vs",
        slide: "Slide 9",

        q: "In Slide 9 ('The 5 V's — Simple Questions'), if a system architect asks: 'What form does the incoming data take?' and 'What can we actually do with it to help users?', which two V's are being evaluated in order?",

          "Volume and Velocity",
          "Variety and Value",
          "Veracity and Variety",
          "Velocity and Veracity"

    let userAnswers = {};
    let currentTopic = "ALL";
    let currentStatus = "ALL";

    function setTopic(topic, btn) {
      currentTopic = topic;
      document.querySelectorAll("#topicFilters .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      renderQuestions();
    }

    function setStatus(status, btn) {
      currentStatus = status;
      document.querySelectorAll("#statusFilters .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      renderQuestions();
    }

    function selectAnswer(qId, optIdx) {
      if (userAnswers[qId] !== undefined) return;
      userAnswers[qId] = optIdx;
      updateStats();
      renderQuestions();
    }

    function retryQuestion(qId) {
      delete userAnswers[qId];
      updateStats();
      renderQuestions();
    }

    function resetAll() {
      userAnswers = {};
      updateStats();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateStats() {
      const answeredIds = Object.keys(userAnswers);
      let correct = 0;
      let wrong = 0;
      answeredIds.forEach(id => {
        const q = questions.find(item => item.id === Number(id));
        if (userAnswers[id] === q.ans) correct++;
        else wrong++;
      });
      const totalAns = answeredIds.length;
      const pct = totalAns > 0 ? Math.round((correct / totalAns) * 100) : 0;

      document.getElementById("stat-progress").textContent = `Answered: ${totalAns} / ${questions.length}`;
      document.getElementById("stat-correct").textContent = `Correct: ${correct}`;
      document.getElementById("stat-wrong").textContent = `Wrong: ${wrong}`;
      document.getElementById("stat-score").textContent = `Score: ${pct}%`;
    }

    function renderQuestions() {
      const container = document.getElementById("questionsContainer");
      const query = document.getElementById("searchBox").value.trim().toLowerCase();
      const letters = ["A", "B", "C", "D"];

      const filtered = questions.filter(q => {
        if (currentTopic !== "ALL" && q.topic !== currentTopic) return false;
        if (currentStatus === "UNANSWERED" && userAnswers[q.id] !== undefined) return false;
        if (currentStatus === "WRONG" && (userAnswers[q.id] === undefined || userAnswers[q.id] === q.ans)) return false;
        if (currentStatus === "FALSE_STMT" && q.type !== "Identify the FALSE Statement") return false;
        if (query) {
          const hay = (q.q + " " + q.topic + " " + q.slide + " " + q.type + " " + q.options.join(" ")).toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      container.innerHTML = filtered.map(q => {
        const chosen = userAnswers[q.id];
        const isAnswered = chosen !== undefined;
        const isCorrect = isAnswered && chosen === q.ans;
        const cardClass = isAnswered ? (isCorrect ? "q-card answered-correct" : "q-card answered-wrong") : "q-card";

        const optsHtml = q.options.map((optText, idx) => {
          let btnClass = "opt-btn";
          if (isAnswered) {
            if (idx === q.ans) btnClass += " correct-choice";
            else if (idx === chosen && chosen !== q.ans) btnClass += " wrong-choice";
          }
          return `
            <button class="${btnClass}" ${isAnswered ? "disabled" : ""} onclick="selectAnswer(${q.id}, ${idx})">
              <span class="opt-letter">${letters[idx]}</span>
              <span>${optText}</span>
            </button>
          `;
        }).join("");

        return `
          <div class="${cardClass}" id="q-card-${q.id}">
            <div class="q-meta">
              <span class="badge">Q${q.id} of 70</span>
              <span class="badge slide">${q.slide}</span>
              <span class="badge">${q.topic}</span>
              <span class="badge type">${q.type}</span>
            </div>
            <div class="q-text">${q.q}</div>
            <div class="options-list">
              ${optsHtml}
            </div>
            <div class="explanation-box ${isAnswered ? "visible" : ""}">
              <div class="exp-header ${isCorrect ? "pass" : "fail"}">
                <span>${isCorrect ? "✓ Correct! Deep Conceptual Match (Answer: " + letters[q.ans] + ")" : "✗ Incorrect — You chose " + (isAnswered ? letters[chosen] : "") + ", but the correct answer is " + letters[q.ans]}</span>
                <button class="retry-mini" onclick="retryQuestion(${q.id})">Retry Question</button>
              </div>
              <div><strong>Conceptual Explanation (${q.slide}):</strong> ${q.exp}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function downloadHTML() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "big_data_part1_deep_exam_70.html";
      a.click();
    }

    renderQuestions();
  </script>
